services:
  postgres:
    image: postgres:16
    container_name: stockily-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockily
      POSTGRES_USER: stockily
      POSTGRES_PASSWORD: stockily
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - stockily_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stockily -d stockily']
      interval: 5s
      timeout: 3s
      retries: 10

  # api/web are an alternative to `nx serve` for running the app, not meant
  # to run alongside it on the same ports (both default to 3000/4200).
  # Migrations/seeding aren't run automatically here — do that once via
  # `npm run prisma:migrate && npm run db:seed` against the same postgres
  # before starting these, same as the nx serve workflow.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: stockily-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://stockily:stockily@postgres:5432/stockily?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@stockily.dz}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # wget (not curl) -- that's what's actually present in node:22-alpine.
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    container_name: stockily-web
    restart: unless-stopped
    ports:
      - '127.0.0.1:4200:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  stockily_pgdata:
