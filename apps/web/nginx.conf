server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Built files have a content hash in their name: cache them for good, and
    # NEVER fall back to index.html for one that doesn't exist. An old browser
    # tab asking for a file from a previous deploy used to receive HTML with a
    # 200, which the browser then failed to run as JavaScript (blank page). A
    # real 404 lets the app detect it and reload onto the new version.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry point must always be revalidated so a refresh picks up the
    # latest file names right after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: client-side routing (React Router) owns any other path.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
