[package]
name = "stockily-desktop"
version = "0.1.0"
description = "Stockily — application de bureau (fonctionne hors ligne)"
edition = "2021"

[lib]
name = "stockily_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "process", "io-util"] }
jsonwebtoken = "9"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
wmi = "0.14"
mac_address = "1"
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[profile.release]
# Smaller binary, and symbols stripped: the license checks live in this
# executable, so don't ship a symbol map of them.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
